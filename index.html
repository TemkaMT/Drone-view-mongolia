<style>
:root { color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: sticky bar with three pages (home, news, contact). Home has a hero with a drifting contour map and live Mongolia coordinates, video cards and a photo grid. */
:root {
  --bg: #e8edee;
  --surface: #f4f7f7;
  --surface-2: #dde5e7;
  --fg: #12232b;
  --muted: #4a5f67;
  --line: #c3cfd2;
  --accent: #1c58b8;
  --on-accent: #ffffff;
  --ochre: #9c5b14;
  --c1: #a3b8be;
  --c2: #1c58b8;
  --font-display: "Unbounded", "Onest", system-ui, sans-serif;
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1519;
    --surface: #121f25;
    --surface-2: #17272e;
    --fg: #e6eef0;
    --muted: #9bb1b8;
    --line: #25373e;
    --accent: #6fa8ff;
    --on-accent: #0b1519;
    --ochre: #e3a65a;
    --c1: #2a424b;
    --c2: #4f8fe8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1519;
  --surface: #121f25;
  --surface-2: #17272e;
  --fg: #e6eef0;
  --muted: #9bb1b8;
  --line: #25373e;
  --accent: #6fa8ff;
  --on-accent: #0b1519;
  --ochre: #e3a65a;
  --c1: #2a424b;
  --c2: #4f8fe8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--fg); font: 400 1rem/1.65 var(--font-body); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.wrap { max-width: 1120px; margin-inline: auto; padding-inline: clamp(16px, 4vw, 32px); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 8px 16px; min-height: 56px; flex-wrap: wrap; padding-block: 6px; }
.brand { font: 600 .78rem/1 var(--font-display); letter-spacing: .05em; text-transform: uppercase; text-decoration: none; margin-right: auto; }
.brand span { color: var(--accent); }
.bar nav { display: flex; gap: 12px; }
.bar nav a { font: 500 .8rem var(--font-mono); text-decoration: none; color: var(--muted); padding: 8px 4px; }
.bar nav a:hover { color: var(--fg); }
.ctl { font: 500 .75rem var(--font-mono); background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; cursor: pointer; }
.ctl:hover { border-color: var(--accent); }

/* hero */
.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(90deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 80%, transparent) 45%, transparent 80%); }
.hero .wrap { position: relative; z-index: 2; padding-block: clamp(56px, 10vw, 120px) 24px; display: grid; gap: 40px; }
.eyebrow { font: 500 .75rem var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ochre); margin: 0; }
h1 { font: 600 clamp(2rem, 6.4vw, 4.2rem)/1.08 var(--font-display); letter-spacing: -.01em; margin: 14px 0 18px; max-width: 14em; text-wrap: balance; }
.lead { max-width: 38rem; color: var(--muted); font-size: clamp(1rem, 1.6vw, 1.15rem); margin: 0; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
.btn { display: inline-flex; align-items: center; gap: 6px; font: 600 .9rem/1.2 var(--font-body); padding: 11px 18px; border-radius: 4px; background: var(--accent); color: var(--on-accent); text-decoration: none; border: 1px solid var(--accent); }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--accent); filter: none; }
.btn[aria-disabled="true"] { color: var(--muted); border-style: dashed; cursor: default; }
.btn[aria-disabled="true"]:hover { border-color: var(--line); }
.readout { font: 400 .78rem var(--font-mono); color: var(--muted); display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: baseline; }
.readout b { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }
@media (max-width: 700px) {
  .hero::before { background: color-mix(in srgb, var(--bg) 78%, transparent); }
}

/* sections */
section { padding-block: clamp(48px, 8vw, 88px); }
h2 { font: 600 clamp(1.4rem, 3vw, 2rem)/1.15 var(--font-display); margin: 0 0 10px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 32px; max-width: 40rem; }

/* cards */
.cards { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.thumb { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--surface-2); }
.thumb canvas { width: 100%; height: 100%; display: block; }
.tags { position: absolute; inset: 10px 10px auto 10px; display: flex; justify-content: space-between; gap: 8px; }
.tag { font: 500 .68rem var(--font-mono); letter-spacing: .08em; padding: 3px 7px; border-radius: 3px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); }
.thumb .play { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: #000; cursor: pointer; display: block; }
.thumb .play img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .92; }
.thumb .play:hover img { opacity: 1; }
.thumb .tri { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: var(--accent); }
.thumb .tri::after { content: ""; position: absolute; left: 22px; top: 17px; border-left: 17px solid var(--on-accent); border-top: 11px solid transparent; border-bottom: 11px solid transparent; }
.thumb iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.tags { pointer-events: none; }
.card .body { padding: 16px; display: grid; gap: 10px; align-content: start; flex: 1; min-width: 0; }
.kind { font: 500 .7rem var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ochre); }
.card h3 { font: 600 1.05rem/1.25 var(--font-display); margin: 0; }
.card p { margin: 0; color: var(--muted); font-size: .93rem; }
.coord { font: 400 .75rem var(--font-mono); color: var(--muted); align-self: end; padding-top: 4px; }
.card .btn { justify-self: start; }

/* photos */
.photos { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
.photo { margin: 0; display: grid; gap: 10px; min-width: 0; }
.ph { position: relative; aspect-ratio: 4 / 3; max-width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.ph canvas, .ph img { width: 100%; height: 100%; display: block; object-fit: cover; }
.photo figcaption { font: 400 .8rem var(--font-mono); color: var(--muted); }
.photo figcaption b { color: var(--fg); font-weight: 500; }

/* news and contact */
.bar nav a[aria-current="page"] { color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
.empty { border: 1px dashed var(--line); border-radius: 6px; padding: 28px; color: var(--muted); max-width: 40rem; }
.news { display: grid; max-width: 44rem; }
.news article { border-top: 1px solid var(--line); padding-block: 20px; display: grid; gap: 6px; }
.news time { font: 500 .75rem var(--font-mono); letter-spacing: .08em; color: var(--ochre); }
.news h3 { margin: 0; font: 600 1.1rem/1.3 var(--font-display); }
.news p { margin: 0; color: var(--muted); }
.contact { display: grid; max-width: 40rem; margin: 0; }
.contact div { display: grid; grid-template-columns: 8rem minmax(0, 1fr); gap: 12px; padding-block: 16px; border-top: 1px solid var(--line); }
.contact div:last-child { border-bottom: 1px solid var(--line); }
.contact dt { font: 500 .8rem var(--font-mono); color: var(--muted); }
.contact dd { margin: 0; overflow-wrap: anywhere; }
.contact .soon { color: var(--muted); }
@media (max-width: 480px) { .contact div { grid-template-columns: minmax(0, 1fr); gap: 2px; } }

footer { border-top: 1px solid var(--line); padding-block: 28px calc(28px + env(safe-area-inset-bottom, 0px)); }
footer .wrap { display: flex; gap: 8px 24px; flex-wrap: wrap; justify-content: space-between; font: 400 .78rem var(--font-mono); color: var(--muted); }

@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>

      for (j = 0; j < rows; j++) {
        for (i = 0; i < cols; i++) {
          var a = g[j * stride + i], b = g[j * stride + i + 1], c = g[(j + 1) * stride + i + 1], d = g[(j + 1) * stride + i];
          var idx = (a > L ? 8 : 0) | (b > L ? 4 : 0) | (c > L ? 2 : 0) | (d > L ? 1 : 0);
          if (idx === 0 || idx === 15) continue;
          var x = i * cell, y = j * cell;
          var tx = x + cell * ((L - a) / (b - a)), ty = y;
          var rx = x + cell, ry = y + cell * ((L - b) / (c - b));
          var bx = x + cell * ((L - d) / (c - d)), by = y + cell;
          var lx = x, ly = y + cell * ((L - a) / (d - a));
          switch (idx) {
            case 1: case 14: seg(lx, ly, bx, by); break;
            case 2: case 13: seg(bx, by, rx, ry); break;
            case 3: case 12: seg(lx, ly, rx, ry); break;
            case 4: case 11: seg(tx, ty, rx, ry); break;
            case 5: seg(tx, ty, rx, ry); seg(lx, ly, bx, by); break;
            case 6: case 9: seg(tx, ty, bx, by); break;
            case 7: case 8: seg(tx, ty, lx, ly); break;
            case 10: seg(tx, ty, lx, ly); seg(rx, ry, bx, by); break;
          }
        }
      }
      ctx.strokeStyle = strong ? COL.c2 : COL.c1;
      ctx.lineWidth = strong ? 1.3 : 0.8;
      ctx.stroke();
    }
    function seg(ax, ay, bx2, by2) { ctx.moveTo(ax, ay); ctx.lineTo(bx2, by2); }
  }

  /* ---------- hero ---------- */
  var hero = document.getElementById("hero");
  var heroCv = document.getElementById("heroCv");
  var running = false, last = 0;
  function drawHero(t) {
    paint(heroCv, { seed: 5, cell: 12, freq: 0.07, ox: t * 0.00005, oy: t * 0.00003 });
  }
  function frame(t) {
    if (!running) return;
    if (t - last > 40) { last = t; drawHero(t); }
    requestAnimationFrame(frame);
  }
  drawHero(0);
  if (!reduce && "IntersectionObserver" in window) {
    new IntersectionObserver(function (es) {
      var vis = es[0].isIntersecting;
      if (vis && !running) { running = true; requestAnimationFrame(frame); }
      if (!vis) running = false;
    }).observe(hero);
  }

  /* live coordinates inside Mongolia's bounding box */
  var ro = document.getElementById("readout"), ron = document.getElementById("readoutName");
  hero.addEventListener("pointermove", function (e) {
    var r = hero.getBoundingClientRect();
    var fx = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1);
    var fy = Math.min(Math.max((e.clientY - r.top) / r.height, 0), 1);
    ro.textContent = (52.1 - fy * 10.5).toFixed(1) + "°N " + (87.7 + fx * 32.2).toFixed(1) + "°E";
    ron.textContent = "";
  });
  hero.addEventListener("pointerleave", function () {
    ro.textContent = "47.9°N 106.9°E";
    ron.textContent = T[lang].readout_default;
  });

  /* ---------- cards ---------- */
  var cardsEl = document.getElementById("cards");
  function ytId(u) {
    if (!u) return "";
    var m = String(u).match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/);
    if (m) return m[1];
    return /^[A-Za-z0-9_-]{11}$/.test(u) ? u : "";
  }
  function renderCards() {
    var t = T[lang];
    cardsEl.innerHTML = PLACES.map(function (p) {
      var info = t.places[p.id], id = ytId(p.url), media, btn;
      if (id) {
        media = '<button class="play" type="button" data-yt="' + id + '" data-title="' + info.n + '" aria-label="' + t.play + ": " + info.n + '">' +
          '<img src="https://i.ytimg.com/vi/' + id + '/hqdefault.jpg" alt="" loading="lazy"><span class="tri" aria-hidden="true"></span></button>' +
          '<div class="tags"><span class="tag">4K</span></div>';
        btn = '<a class="btn ghost" href="https://www.youtube.com/watch?v=' + id + '" target="_blank" rel="noopener">' + t.watch + "</a>";
      } else {
        media = '<canvas data-seed="' + p.seed + '" aria-hidden="true"></canvas><div class="tags"><span class="tag">4K</span><span class="tag">' + t.soon + "</span></div>";
        btn = '<span class="btn ghost" aria-disabled="true">' + t.soon_btn + "</span>";
      }
      return '<article class="card"><div class="thumb">' + media + "</div>" +
        '<div class="body"><span class="kind">' + t.kinds[p.kind] + "</span><h3>" + info.n + "</h3><p>" + info.d + "</p>" +
        '<span class="coord">' + info.a + " · " + p.lat + " " + p.lon + "</span>" + btn + "</div></article>";
    }).join("");
    paintCards();
  }
  cardsEl.addEventListener("click", function (e) {
    var b = e.target.closest(".play");
    if (!b) return;
    var th = b.parentNode;
    th.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + b.getAttribute("data-yt") + '?autoplay=1&rel=0" title="' + b.getAttribute("data-title") +
      '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>';
  });
  function paintCards() {
    var cvs = document.querySelectorAll("#cards canvas, #photosGrid canvas");
    for (var i = 0; i < cvs.length; i++) {
      paint(cvs[i], { seed: +cvs[i].getAttribute("data-seed"), cell: 8, freq: 0.11, ox: 3.7, oy: 1.9 });
    }
  }

  /* ---------- language ---------- */
  function applyLang() {
    var t = T[lang];
    root.lang = lang === "mn" ? "mn" : "en";
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var k = el.getAttribute("data-i18n");
      if (t[k] !== undefined) el.textContent = t[k];
    });
    document.querySelectorAll("[data-i18n-aria]").forEach(function (el) {
      el.setAttribute("aria-label", t[el.getAttribute("data-i18n-aria")]);
    });
    document.getElementById("langBtn").textContent = lang === "mn" ? "EN" : "МН";
    renderNews();
    renderContacts();
    renderPhotos();
    renderCards();
  }
  document.getElementById("langBtn").addEventListener("click", function () {
    lang = lang === "mn" ? "en" : "mn";
    try { localStorage.setItem("dvm-lang", lang); } catch (e) {}
    applyLang();
  });

  /* ---------- theme ---------- */
  function currentTheme() {
    var a = root.getAttribute("data-theme");
    if (a) return a;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function refreshArt() {
    COL = readColors();
    drawHero(last);
    paintCards();
  }
  document.getElementById("themeBtn").addEventListener("click", function () {
    var next = currentTheme() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("dvm-theme", next); } catch (e) {}
    refreshArt();
  });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", refreshArt);

  /* ---------- photos ---------- */
  /* Put each real photo in img (a file path published with the page). An empty img shows a placeholder. */
  var photosEl = document.getElementById("photosGrid");
  var PHOTOS = [
    { id: "khuvsgul", seed: 111, img: "" },
    { id: "altai",    seed: 159, img: "" },
    { id: "khongor",  seed: 137, img: "" },
    { id: "terelj",   seed: 167, img: "" },
    { id: "orkhon",   seed: 141, img: "" },
    { id: "terkh",    seed: 123, img: "" }
  ];
  function renderPhotos() {
    var t = T[lang];
    photosEl.innerHTML = PHOTOS.map(function (p) {
      var info = t.places[p.id];
      var inner = p.img
        ? '<img src="' + p.img + '" alt="' + info.n + '" loading="lazy">'
        : '<canvas data-seed="' + p.seed + '" aria-hidden="true"></canvas><div class="tags"><span class="tag">' + t.soon + "</span></div>";
      return '<figure class="photo"><div class="ph">' + inner + "</div><figcaption><b>" + info.n + "</b> · " + info.a + "</figcaption></figure>";
    }).join("");
  }

  /* ---------- news and contact ---------- */
  /* News: add { date: "2026-10-10", t: { mn: "...", en: "..." }, d: { mn: "...", en: "..." } }. */
  var NEWS = [];
  /* Contact: fill value with an address or a full https link. An empty value shows "coming soon". */
  var CONTACTS = [
    { id: "email", value: "" },
    { id: "facebook", value: "" },
    { id: "instagram", value: "" },
    { id: "youtube", value: "" }
  ];
  function renderNews() {
    var t = T[lang], el = document.getElementById("newsList");
    el.innerHTML = NEWS.length
      ? '<div class="news">' + NEWS.map(function (n) {
          return "<article><time>" + n.date + "</time><h3>" + n.t[lang] + "</h3><p>" + n.d[lang] + "</p></article>";
        }).join("") + "</div>"
      : '<div class="empty">' + t.news_empty + "</div>";
  }
  function renderContacts() {
    var t = T[lang];
    document.getElementById("contactList").innerHTML = CONTACTS.map(function (c) {
      var v = c.value
        ? (/^https?:\/\//.test(c.value) ? '<a href="' + c.value + '" target="_blank" rel="noopener">' + c.value.replace(/^https?:\/\//, "") + "</a>" : (c.value.indexOf("@") > 0 ? '<a href="mailto:' + c.value + '">' + c.value + "</a>" : c.value))
        : '<span class="soon">' + t.c_soon + "</span>";
      return "<div><dt>" + t["c_" + c.id] + "</dt><dd>" + v + "</dd></div>";
    }).join("");
  }

  /* ---------- pages ---------- */
  var navLinks = document.querySelectorAll("nav a[data-route]");
  function route() {
    var h = location.hash.replace("#", "");
    var view = h === "news" || h === "contact" ? h : "home";
    ["home", "news", "contact"].forEach(function (v) { document.getElementById("view-" + v).hidden = v !== view; });
    navLinks.forEach(function (a) {
      if (a.getAttribute("data-route") === view) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    if (view === "home") {
      drawHero(last);
      paintCards();
      var el = (h === "videos" || h === "photos") ? document.getElementById(h) : null;
      if (el) el.scrollIntoView(); else window.scrollTo(0, 0);
    } else {
      window.scrollTo(0, 0);
    }
  }
  window.addEventListener("hashchange", route);

  /* ---------- resize ---------- */
  var rt;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () { drawHero(last); paintCards(); }, 150);
  });

  /* ---------- start ---------- */
  try {
    var sl = localStorage.getItem("dvm-lang");
    if (sl === "en" || sl === "mn") lang = sl;
    var st = localStorage.getItem("dvm-theme");
    if (st === "light" || st === "dark") { root.setAttribute("data-theme", st); COL = readColors(); }
  } catch (e) {}
  applyLang();
  route();
})();
</script>

</body>
</html>

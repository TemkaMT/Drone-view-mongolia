<style>
:root { color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }

/* Layout: sticky bar with four pages (home, videos anchor, news, contact) plus a hidden admin page. Home has a hero with a drifting contour map and live Mongolia coordinates, video cards and a photo grid. */
:root {
  --bg: #e8edee;
  --surface: #f4f7f7;
  --surface-2: #dde5e7;
  --fg: #12232b;
  --muted: #4a5f67;
  --line: #c3cfd2;
  --accent: #1c58b8;
  --on-accent: #ffffff;
  --ochre: #9c5b14;
  --danger: #b3261e;
  --c1: #a3b8be;
  --c2: #1c58b8;
  --font-display: "Unbounded", "Onest", system-ui, sans-serif;
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1519;
    --surface: #121f25;
    --surface-2: #17272e;
    --fg: #e6eef0;
    --muted: #9bb1b8;
    --line: #25373e;
    --accent: #6fa8ff;
    --on-accent: #0b1519;
    --ochre: #e3a65a;
    --danger: #ff8a80;
    --c1: #2a424b;
    --c2: #4f8fe8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1519;
  --surface: #121f25;
  --surface-2: #17272e;
  --fg: #e6eef0;
  --muted: #9bb1b8;
  --line: #25373e;
  --accent: #6fa8ff;
  --on-accent: #0b1519;
  --ochre: #e3a65a;
  --danger: #ff8a80;
  --c1: #2a424b;
  --c2: #4f8fe8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--fg); font: 400 1rem/1.65 var(--font-body); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.wrap { max-width: 1120px; margin-inline: auto; padding-inline: clamp(16px, 4vw, 32px); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 8px 16px; min-height: 56px; flex-wrap: wrap; padding-block: 6px; }
.brand { font: 600 .78rem/1 var(--font-display); letter-spacing: .05em; text-transform: uppercase; text-decoration: none; margin-right: auto; }
.brand span { color: var(--accent); }
.bar nav { display: flex; gap: 4px 12px; flex-wrap: wrap; }
.bar nav a { font: 500 .8rem var(--font-mono); text-decoration: none; color: var(--muted); padding: 8px 4px; }
.bar nav a:hover { color: var(--fg); }
.bar nav a[aria-current="page"] { color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
.ctl { font: 500 .75rem var(--font-mono); background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; cursor: pointer; }
.ctl:hover { border-color: var(--accent); }

/* hero */
.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(90deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 80%, transparent) 45%, transparent 80%); }
.hero .wrap { position: relative; z-index: 2; padding-block: clamp(56px, 10vw, 120px) 24px; display: grid; gap: 40px; }
.eyebrow { font: 500 .75rem var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ochre); margin: 0; }
h1 { font: 600 clamp(2rem, 6.4vw, 4.2rem)/1.08 var(--font-display); letter-spacing: -.01em; margin: 14px 0 18px; max-width: 14em; text-wrap: balance; }
.lead { max-width: 38rem; color: var(--muted); font-size: clamp(1rem, 1.6vw, 1.15rem); margin: 0; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
.btn { display: inline-flex; align-items: center; gap: 6px; font: 600 .9rem/1.2 var(--font-body); padding: 11px 18px; border-radius: 4px; background: var(--accent); color: var(--on-accent); text-decoration: none; border: 1px solid var(--accent); cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--accent); filter: none; }
.btn[aria-disabled="true"] { color: var(--muted); border-style: dashed; cursor: default; }
.btn[aria-disabled="true"]:hover { border-color: var(--line); }
.readout { font: 400 .78rem var(--font-mono); color: var(--muted); display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: baseline; }
.readout b { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }
@media (max-width: 700px) {
  .hero::before { background: color-mix(in srgb, var(--bg) 78%, transparent); }
}

/* sections */
section { padding-block: clamp(48px, 8vw, 88px); }
h2 { font: 600 clamp(1.4rem, 3vw, 2rem)/1.15 var(--font-display); margin: 0 0 10px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 32px; max-width: 40rem; }
.empty { border: 1px dashed var(--line); border-radius: 6px; padding: 28px; color: var(--muted); max-width: 40rem; }

/* video cards */
.cards { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.thumb { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--surface-2); }
.thumb canvas { width: 100%; height: 100%; display: block; }
.thumb .play { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: #000; cursor: pointer; display: block; }
.thumb .play img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .92; }
.thumb .play:hover img { opacity: 1; }
.thumb .tri { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: var(--accent); }
.thumb .tri::after { content: ""; position: absolute; left: 22px; top: 17px; border-left: 17px solid var(--on-accent); border-top: 11px solid transparent; border-bottom: 11px solid transparent; }
.thumb iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.tags { position: absolute; inset: 10px 10px auto 10px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
.tag { font: 500 .68rem var(--font-mono); letter-spacing: .08em; padding: 3px 7px; border-radius: 3px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); }
.card .body { padding: 16px; display: grid; gap: 10px; align-content: start; flex: 1; min-width: 0; }
.kind { font: 500 .7rem var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ochre); }
.card h3 { font: 600 1.05rem/1.25 var(--font-display); margin: 0; overflow-wrap: anywhere; }
.card p { margin: 0; color: var(--muted); font-size: .93rem; overflow-wrap: anywhere; }
.coord { font: 400 .75rem var(--font-mono); color: var(--muted); align-self: end; padding-top: 4px; }
.card .btn { justify-self: start; }

/* photos */
.photos { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
.photo { margin: 0; display: grid; gap: 10px; min-width: 0; align-content: start; }
.ph { position: relative; aspect-ratio: 4 / 3; max-width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.ph canvas, .ph img { width: 100%; height: 100%; display: block; object-fit: cover; }
.ph-btn { all: unset; display: block; width: 100%; height: 100%; cursor: zoom-in; }
.ph-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
.photo figcaption { font: 400 .8rem var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
.photo figcaption b { color: var(--fg); font-weight: 500; }
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .9); display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
.lb img { max-width: 100%; max-height: 100%; object-fit: contain; }
.lb .lb-x { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 16px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .4); background: transparent; color: #fff; font-size: 1.4rem; line-height: 1; cursor: pointer; }

/* news and contact */
.news { display: grid; max-width: 44rem; }
.news article { border-top: 1px solid var(--line); padding-block: 20px; display: grid; gap: 6px; }
.news time { font: 500 .75rem var(--font-mono); letter-spacing: .08em; color: var(--ochre); }
.news h3 { margin: 0; font: 600 1.1rem/1.3 var(--font-display); overflow-wrap: anywhere; }
.news p { margin: 0; color: var(--muted); white-space: pre-line; overflow-wrap: anywhere; }
.contact { display: grid; max-width: 40rem; margin: 0; }
.contact div { display: grid; grid-template-columns: 8rem minmax(0, 1fr); gap: 12px; padding-block: 16px; border-top: 1px solid var(--line); }
.contact div:last-child { border-bottom: 1px solid var(--line); }
.contact dt { font: 500 .8rem var(--font-mono); color: var(--muted); }
.contact dd { margin: 0; overflow-wrap: anywhere; }
.contact .soon { color: var(--muted); }
@media (max-width: 480px) { .contact div { grid-template-columns: minmax(0, 1fr); gap: 2px; } }

/* admin */
.in { width: 100%; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; }
textarea.in { min-height: 84px; resize: vertical; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font: 500 .75rem var(--font-mono); color: var(--muted); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 520px) { .two { grid-template-columns: minmax(0, 1fr); } }
.form { display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; min-width: 0; }
.form .in { background: var(--bg); }
.form h3 { margin: 0; font: 600 1rem/1.3 var(--font-display); }
.login { max-width: 26rem; }
.who { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font: 400 .8rem var(--font-mono); color: var(--muted); margin: 0 0 8px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-block: 16px 24px; }
.tabs .ctl[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.adm { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(20px, 4vw, 40px); align-items: start; }
@media (max-width: 800px) { .adm { grid-template-columns: minmax(0, 1fr); } }
.list { display: grid; min-width: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; padding-block: 12px; border-top: 1px solid var(--line); align-items: center; }
.row:last-child { border-bottom: 1px solid var(--line); }
.row.has-img { grid-template-columns: 64px minmax(0, 1fr) auto; }
.row img { width: 64px; height: 48px; object-fit: cover; border-radius: 3px; display: block; }
.row .t { overflow-wrap: anywhere; }
.row .m { font: 400 .75rem var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
.acts { display: flex; gap: 8px; }
.mini { font: 500 .72rem var(--font-mono); background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 5px 9px; cursor: pointer; }
.mini:hover { border-color: var(--accent); }
.mini.danger { color: var(--danger); }
.msg { font: 400 .8rem var(--font-mono); color: var(--muted); min-height: 1.3em; margin: 12px 0 0; }
.msg.err { color: var(--danger); }
.hint { font: 400 .8rem var(--font-mono); color: var(--muted); margin: 0; }

footer { border-top: 1px solid var(--line); padding-block: 28px calc(28px + env(safe-area-inset-bottom, 0px)); }
footer .wrap { display: flex; gap: 8px 24px; flex-wrap: wrap; justify-content: space-between; font: 400 .78rem var(--font-mono); color: var(--muted); }
footer a { text-decoration: none; }
footer a:hover { color: var(--fg); }

@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>

  <div id="view-news" hidden>

        <div id="newsList"></div>
      </div>
    </section>
  </div>

  <div id="view-contact" hidden>
    <section>
      <div class="wrap">

      </div>

  </div>

  <div id="view-admin" hidden>
    <section>
      <div class="wrap">
        <h2>Админ</h2>
        <div id="adminRoot"></div>
      </div>
    </section>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 Drone View Mongolia</span>
    <span data-i18n="footer">Ашгийн бус</span>

  </div>
</footer>

  function noise(x, y, seed) {
    var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;

    var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    var top = h(xi, yi) + (h(xi + 1, yi) - h(xi, yi)) * u;
    var bot = h(xi, yi + 1) + (h(xi + 1, yi + 1) - h(xi, yi + 1)) * u;
    return top + (bot - top) * v;
  }
  function fbm(x, y, seed) {

  function paint(cv, o) {
    var w = cv.clientWidth, h = cv.clientHeight;

    var dpr = Math.min(window.devicePixelRatio || 1, 2);

    ctx.clearRect(0, 0, w, h);
    var cell = o.cell, cols = Math.ceil(w / cell) + 1, rows = Math.ceil(h / cell) + 1, stride = cols + 1;
    var g = new Float32Array(stride * (rows + 1));
    for (var j = 0; j <= rows; j++) {
      for (var i = 0; i <= cols; i++) g[j * stride + i] = fbm(i * o.freq + o.ox, j * o.freq + o.oy, o.seed);
    }
    for (var li = 0; li < 16; li++) {
      var L = 0.22 + li * 0.035, strong = li % 4 === 0;

            case 2: case 13: seg(bx, by, rx, ry); break;
            case 3: case 12: seg(lx, ly, rx, ry); break;
            case 4: case 11: seg(tx, ty, rx, ry); break;
            case 5: seg(tx, ty, rx, ry); seg(lx, ly, bx, by); break;
            case 6: case 9: seg(tx, ty, bx, by); break;
            case 7: case 8: seg(tx, ty, lx, ly); break;
            case 10: seg(tx, ty, lx, ly); seg(rx, ry, bx, by); break;

  }

  function rowActs(type, id, canEdit) {
    return '<div class="acts">' + (canEdit ? '<button class="mini" type="button" data-act="edit" data-type="' + type + '" data-id="' + esc(id) + '">Засах</button>' : "") +
      '<button class="mini danger" type="button" data-act="del" data-type="' + type + '" data-id="' + esc(id) + '">Устгах</button></div>';
  }
  function listHtml() {
    var rows = "";
    if (tab === "videos") {
      rows = data.videos.map(function (v) {
        return '<div class="row"><div><div class="t">' + esc(v.title_mn) + '</div><div class="m">' + esc(v.url) + "</div></div>" + rowActs("videos", v.id, true) + "</div>";
      }).join("");
    } else if (tab === "photos") {
      rows = data.photos.map(function (p) {
        return '<div class="row has-img"><img src="' + esc(p.url) + '" alt=""><div><div class="t">' + esc(p.title_mn || "Нэргүй зураг") + "</div></div>" + rowActs("photos", p.id, false) + "</div>";
      }).join("");
    } else if (tab === "news") {
      rows = data.news.map(function (n) {
        return '<div class="row"><div><div class="t">' + esc(n.title_mn) + '</div><div class="m">' + esc(n.date) + "</div></div>" + rowActs("news", n.id, true) + "</div>";
      }).join("");
    }
    if (tab === "contacts") return '<p class="hint">Сайтын "Холбоо барих" хуудсанд энд бичсэн мэдээлэл харагдана.</p>';
    return rows ? '<div class="list">' + rows + "</div>" : '<div class="empty">Одоогоор юу ч алга. Зүүн талын хэсгээр нэмнэ үү.</div>';
  }

  function renderAdmin() {
    if (!sb) {
      adminEl.innerHTML = '<div class="empty">Админ хараахан тохируулаагүй байна. Supabase-ийн холболтыг <code>index.html</code>-д нэмсний дараа энд нэвтрэх хэсэг гарна.</div>';
      return;
    }
    if (!session) {
      adminEl.innerHTML = '<form class="form login" data-type="login"><h3>Нэвтрэх</h3>' +
        inp("email", "И-мэйл", "", { type: "email", req: 1, auto: "username" }) +
        inp("password", "Нууц үг", "", { type: "password", req: 1, auto: "current-password" }) +
        '<div class="actions" style="margin-top:0"><button class="btn" type="submit">Нэвтрэх</button></div>' +
        '<p class="msg' + (adminErr ? " err" : "") + '" id="admMsg">' + esc(adminMsg) + "</p></form>";
      return;
    }
    if (!loaded) { adminEl.innerHTML = '<p class="hint">Ачаалж байна...</p>'; return; }
    if (mode !== "db") {
      adminEl.innerHTML = '<p class="who">' + esc(session.user.email) + ' <button class="mini" type="button" data-act="logout">Гарах</button></p>' +
        '<div class="empty">Мэдээллийн сантай холбогдож чадсангүй. Supabase-ийн SQL тохиргоог (supabase-setup.sql) ажиллуулсан эсэхээ шалгаад хуудсаа дахин ачаална уу.</div>';
      return;
    }
    var panel = tab === "videos" ? videoForm() : tab === "photos" ? photoForm() : tab === "news" ? newsForm() : contactForm();
    adminEl.innerHTML = '<p class="who">' + esc(session.user.email) + ' <button class="mini" type="button" data-act="logout">Гарах</button></p>' +
      '<div class="tabs">' + TABS.map(function (x) {
        return '<button class="ctl" type="button" data-act="tab" data-tab="' + x[0] + '" aria-pressed="' + (x[0] === tab) + '">' + x[1] + "</button>";
      }).join("") + "</div>" +
      '<div class="adm"><div>' + panel + '<p class="msg' + (adminErr ? " err" : "") + '" id="admMsg">' + esc(adminMsg) + "</p></div><div>" + listHtml() + "</div></div>";
  }
  function say(text, isErr) {
    adminMsg = text; adminErr = !!isErr;
    var el = document.getElementById("admMsg");
    if (el) { el.textContent = text; el.className = "msg" + (isErr ? " err" : ""); }
  }
  function reload() {
    return loadData().then(function () { renderAll(); renderAdmin(); });
  }
  function fail(e) { busy = false; say("Алдаа гарлаа: " + (e && e.message ? e.message : e), true); }

  function shrink(file, max) {
    return new Promise(function (res, rej) {
      var img = new Image(), u = URL.createObjectURL(file);
      img.onload = function () {
        var s = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(u);
        c.toBlob(function (b) { b ? res(b) : rej(new Error("Зургийг хөрвүүлж чадсангүй")); }, "image/jpeg", 0.86);
      };
      img.onerror = function () { URL.revokeObjectURL(u); rej(new Error("Зургийг уншиж чадсангүй: " + file.name)); };
      img.src = u;
    });
  }
  function formValues(form, keys) {
    var out = {};
    keys.forEach(function (k) {
      var el = form.elements[k];
      var v = el ? String(el.value).trim() : "";
      out[k] = v === "" ? null : v;
    });
    return out;
  }
  function save(type, payload) {
    var id = editing && editing.type === type ? editing.id : null;
    var q = id ? sb.from(type).update(payload).eq("id", id) : sb.from(type).insert(payload);
    return q.then(function (r) {
      if (r.error) throw r.error;
      editing = null;
      busy = false;
      adminMsg = id ? "Хадгаллаа." : "Нэмлээ."; adminErr = false;
      return reload();
    });
  }

  adminEl.addEventListener("submit", function (e) {
    e.preventDefault();
    if (busy) return;
    var form = e.target, type = form.getAttribute("data-type");
    if (type === "login") {
      busy = true; say("Нэвтэрч байна...");
      sb.auth.signInWithPassword({ email: form.elements.email.value.trim(), password: form.elements.password.value }).then(function (r) {
        busy = false;
        if (r.error) { say("Нэвтэрч чадсангүй. И-мэйл эсвэл нууц үгээ шалгана уу.", true); return; }
        adminMsg = ""; adminErr = false;
      }, fail);
      return;
    }
    if (type === "videos") {
      var p = formValues(form, ["url", "title_mn", "title_en", "desc_mn", "desc_en", "kind", "aimag_mn", "aimag_en", "lat", "lon"]);
      if (!ytId(p.url)) { say("YouTube линк буруу байна. youtu.be/... эсвэл youtube.com/watch?v=... хэлбэртэй линк оруулна уу.", true); return; }
      busy = true; say("Хадгалж байна...");
      save("videos", p).catch(fail);
    } else if (type === "news") {
      var n = formValues(form, ["date", "title_mn", "title_en", "body_mn", "body_en"]);
      busy = true; say("Хадгалж байна...");
      save("news", n).catch(fail);
    } else if (type === "contacts") {
      var rows = CONTACT_KEYS.map(function (k) { return { key: k, value: String(form.elements[k].value).trim() }; });
      busy = true; say("Хадгалж байна...");
      sb.from("contacts").upsert(rows).then(function (r) {
        if (r.error) throw r.error;
        busy = false; adminMsg = "Хадгаллаа."; adminErr = false;
        return reload();
      }).catch(fail);
    } else if (type === "photos") {
      var files = Array.prototype.slice.call(form.elements.files.files);
      var t = formValues(form, ["title_mn", "title_en"]);
      if (!files.length) return;
      busy = true;
      var done = 0;
      files.reduce(function (chain, file) {
        return chain.then(function () {
          say("Оруулж байна " + (done + 1) + " / " + files.length + "...");
          return shrink(file, 1920).then(function (blob) {
            var path = Date.now() + "-" + Math.random().toString(36).slice(2, 8) + ".jpg";
            return sb.storage.from("photos").upload(path, blob, { contentType: "image/jpeg" }).then(function (r) {
              if (r.error) throw r.error;
              var url = sb.storage.from("photos").getPublicUrl(path).data.publicUrl;
              return sb.from("photos").insert({ url: url, path: path, title_mn: t.title_mn, title_en: t.title_en });
            }).then(function (r) { if (r.error) throw r.error; done++; });
          });
        });
      }, Promise.resolve()).then(function () {
        busy = false; adminMsg = done + " зураг нэмлээ."; adminErr = false;
        return reload();
      }).catch(function (err) {
        busy = false;
        say("Алдаа гарлаа (" + done + " зураг орсон): " + (err && err.message ? err.message : err), true);
        reload();
      });
    }
  });

  adminEl.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b || busy) return;
    var act = b.getAttribute("data-act");
    if (act === "tab") { tab = b.getAttribute("data-tab"); editing = null; adminMsg = ""; renderAdmin(); }
    else if (act === "cancel") { editing = null; adminMsg = ""; renderAdmin(); }
    else if (act === "logout") { sb.auth.signOut(); }
    else if (act === "edit") {
      editing = { type: b.getAttribute("data-type"), id: b.getAttribute("data-id") };
      adminMsg = ""; renderAdmin();
      var f = adminEl.querySelector("form"); if (f && f.scrollIntoView) f.scrollIntoView({ block: "start" });
    } else if (act === "del") {
      var type = b.getAttribute("data-type"), id = b.getAttribute("data-id");
      if (!window.confirm("Устгах уу? Үүнийг буцаах боломжгүй.")) return;
      busy = true; say("Устгаж байна...");
      var item = data[type].filter(function (x) { return x.id === id; })[0];
      var pre = (type === "photos" && item && item.path) ? sb.storage.from("photos").remove([item.path]) : Promise.resolve({});
      pre.then(function () { return sb.from(type).delete().eq("id", id); }).then(function (r) {
        if (r.error) throw r.error;
        busy = false; editing = null; adminMsg = "Устгалаа."; adminErr = false;
        return reload();
      }).catch(fail);
    }
  });

  if (sb) {
    sb.auth.getSession().then(function (r) { session = r.data.session; renderAdmin(); });
    sb.auth.onAuthStateChange(function (ev, s) { session = s; if (!s) editing = null; renderAdmin(); });
  }

  /* ---------- pages ---------- */
  var navLinks = document.querySelectorAll("nav a[data-route]");
  function route() {
    var h = location.hash.replace("#", "");
    var view = h === "news" || h === "contact" || h === "admin" ? h : "home";
    ["home", "news", "contact", "admin"].forEach(function (v) { document.getElementById("view-" + v).hidden = v !== view; });
    navLinks.forEach(function (a) {
      if (a.getAttribute("data-route") === view) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    if (view === "home") {
      drawHero(last);
      paintCards();
      var el = (h === "videos" || h === "photos") ? document.getElementById(h) : null;
      if (el) el.scrollIntoView(); else window.scrollTo(0, 0);
    } else {
      window.scrollTo(0, 0);
    }
  }
  window.addEventListener("hashchange", route);

  var rt;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () { drawHero(last); paintCards(); }, 150);
  });

  /* ---------- start ---------- */
  try {
    var sl = localStorage.getItem("dvm-lang");
    if (sl === "en" || sl === "mn") lang = sl;
    var st = localStorage.getItem("dvm-theme");
    if (st === "light" || st === "dark") { root.setAttribute("data-theme", st); COL = readColors(); }
  } catch (e) {}
  applyLang();
  renderAdmin();
  route();
  loadData().then(function () { loaded = true; renderAll(); renderAdmin(); });
})();
</script>
</body>
</html>
